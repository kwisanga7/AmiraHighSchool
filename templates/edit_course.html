{% extends "base.html" %}

{% block title %}
Edit Course
{% endblock %}

{% block content %}

<div class="form-container">
    <form method="POST">

        <label>Course Name</label><br>
        <input
            type="text"
            name="course_name"
            value="{{ course.course_name }}"
            required>
        <br><br>

        <label>Duration</label><br>
        <input
            type="text"
            name="duration"
            value="{{ course.duration }}"
            required>
        <br><br>

        <label>Teacher</label><br>
        <input
            type="text"
            name="teacher"
            value="{{ course.teacher }}"
            required>
        <br><br>

        <label>Fees</label><br>
        <input
            type="number"
            name="fees"
            value="{{ course.fees }}"
            required>
        <br><br>

        <button type="submit">
            Update Course
        </button>

    </form>
</div>

    <br>

    <a href="/admin/courses">
        Back to Courses
    </a>

{% endblock %}
