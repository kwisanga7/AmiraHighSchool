{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="form-container">
    <form method="POST">

        <label>Phone Number</label><br>
        <input type="text" name="phone" required><br><br>

        <label>Password</label><br>
        <input type="password" name="password" required><br><br>

        <button type="submit">Login</button>

    </form>
</div>

{% endblock %}
