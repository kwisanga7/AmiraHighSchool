{% extends "base.html" %}

{% block title %}
Add Course
{% endblock %}

{% block content %}

<div class="form-container">
<form method="POST"
      enctype="multipart/form-data">

    <label>Course Name</label><br>
    <input type="text"
           name="course_name"
           required><br><br>

    <label>Duration</label><br>
    <input type="text"
           name="duration"
           required><br><br>

    <label>Teacher</label><br>
    <input type="text"
           name="teacher"
           required><br><br>

    <label>Fees</label><br>
    <input type="number"
           name="fees"
           required><br><br>

    <label>Photo</label><br>
    <input type="file"
           name="photo"><br><br>

    <button type="submit">
        Save Course
    </button>

</form>
</div>

{% endblock %}
