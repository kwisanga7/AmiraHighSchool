{% extends "base.html" %}

{% block title %}
Admin Dashboard
{% endblock %}

{% block content %}

<div class="dashboard-cards">

    <div class="card">
        <h2>Students</h2>
        <h3>{{ students }}</h3>
    </div>

    <div class="card">
        <h2>Announcements</h2>
        <h3>{{ announcements }}</h3>
    </div>

    <div class="card">
        <h2>Courses</h2>
        <h3>{{ courses }}</h3>
    </div>

</div>

<h2>Quick Actions</h2>

<div class="dashboard-actions">

    <a href="/admin/students" class="action-btn">
        Manage Students
    </a>

    <a href="/admin/courses" class="action-btn">
        Manage Courses
    </a>

    <a href="/admin/announcements" class="action-btn">
        Manage Announcements
    </a>

    <a href="/admin/courses/add" class="action-btn">
        Add Course
    </a>

    <a href="/admin/announcements/add" class="action-btn">
        Add Announcement
    </a>

</div>

{% endblock %}
